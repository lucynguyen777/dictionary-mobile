# Chandra OCR on one NVIDIA GPU host: vLLM serves the model, the app-facing service calls it.
# Only the chandra service is exposed; put HTTPS (a reverse proxy or the host's load balancer) in front.
#
#   cp deploy/chandra.env.example deploy/chandra.env   # fill in the public Supabase values
#   docker compose -f deploy/docker-compose.gpu.yml up -d
#
# Model weights: datalab-to/chandra-ocr-2 (OpenRAIL-style licence; review before commercial use).
services:
  vllm:
    image: vllm/vllm-openai:v0.17.0
    command:
      - --model=datalab-to/chandra-ocr-2
      - --served-model-name=chandra
      - --dtype=bfloat16
      - --max-model-len=18000
      - --gpu-memory-utilization=0.85
      - --enable-prefix-caching
      - --mm-processor-kwargs={"min_pixels":3136,"max_pixels":6291456}
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  chandra:
    build:
      context: ..
    env_file: chandra.env
    environment:
      CHANDRA_METHOD: vllm
      VLLM_API_BASE: http://vllm:8000/v1
      VLLM_MODEL_NAME: chandra
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  huggingface-cache:
